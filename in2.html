<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Exact Curved Reveal Animation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      background: #d7d2ff;

      font-family: Arial, Helvetica, sans-serif;

      overflow: hidden;
    }

    .card {
      position: relative;

      width: min(900px, 90vw);
      height: min(560px, 75vh);

      border-radius: 28px;

      overflow: hidden;

      background: #111;

      box-shadow:
        0 25px 70px rgba(60, 45, 150, 0.25);
    }

    /* --------------------------------
       IMAGE
    -------------------------------- */

    .image-layer {
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.35)
        ),
        url("https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&fit=crop&w=1800&q=90");

      background-size: cover;
      background-position: center;
    }

    .image-layer::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          transparent 50%,
          rgba(0, 0, 0, 0.35)
        );
    }

    /* --------------------------------
       TEXT
    -------------------------------- */

    .content {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 3;

      width: 90%;

      text-align: center;

      color: white;
    }

    .content h1 {
      font-size: clamp(36px, 5vw, 70px);
      font-weight: 500;
      line-height: 1.1;
    }

    .content p {
      margin-top: 16px;

      font-size: 14px;

      opacity: 0.85;
    }

    /* --------------------------------
       WHITE MASK
    -------------------------------- */

    .mask-svg {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 10;

      pointer-events: none;
    }

    /* --------------------------------
       PLAY BUTTON
    -------------------------------- */

    .play-button {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 20;

      width: 68px;
      height: 68px;

      border: none;

      border-radius: 50%;

      background: white;

      cursor: pointer;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.15);

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    .play-button:hover {
      transform:
        translate(-50%, -50%)
        scale(1.08);
    }

    .play-button::before {
      content: "";

      position: absolute;

      top: 50%;
      left: 52%;

      transform: translate(-50%, -50%);

      width: 0;
      height: 0;

      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;

      border-left: 16px solid #111;
    }

    /* --------------------------------
       RESET BUTTON
    -------------------------------- */

    .reset {
      position: fixed;

      bottom: 25px;
      left: 50%;

      transform: translateX(-50%);

      border: 0;

      border-radius: 50px;

      padding: 12px 22px;

      background: #111;
      color: white;

      cursor: pointer;

      font-size: 13px;

      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .card {
        height: 65vh;
        border-radius: 22px;
      }

      .play-button {
        width: 58px;
        height: 58px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- Background image -->

    <div class="image-layer"></div>


    <!-- Background title -->

    <div class="content">

      <h1>
        Architecture Design
      </h1>

      <p>
        Curved curtain reveal animation
      </p>

    </div>


    <!--
      IMPORTANT PART

      White overlay.

      The bottom edge is curved.

      Initially the white shape covers
      almost the complete card.

      We animate the curved bottom edge
      upward.

    -->

    <svg
      class="mask-svg"
      viewBox="0 0 1000 600"
      preserveAspectRatio="none"
    >

      <path
        id="curvedMask"

        fill="#f4f4f4"

        d="
          M 0 0

          L 1000 0

          L 1000 570

          C 760 525
            250 525
            0 570

          Z
        "
      />

    </svg>


    <!-- Play icon -->

    <button
      class="play-button"
      id="playButton"
      aria-label="Play animation"
    ></button>

  </div>


  <button class="reset" id="resetButton">
    Replay Animation
  </button>


  <script>

    const mask =
      document.getElementById("curvedMask");

    const playButton =
      document.getElementById("playButton");

    const resetButton =
      document.getElementById("resetButton");


    /*
      Starting curve

      This matches the reference:
      almost full white panel with a
      slightly bowed lower edge.
    */

    const startPath = `
      M 0 0

      L 1000 0

      L 1000 570

      C 760 525
        250 525
        0 570

      Z
    `;


    /*
      Intermediate positions.

      Notice:

      We are NOT changing the animation
      into a random blob.

      The same smooth curved edge simply
      travels upward.
    */

    const path2 = `
      M 0 0

      L 1000 0

      L 1000 460

      C 760 405
        250 405
        0 460

      Z
    `;


    const path3 = `
      M 0 0

      L 1000 0

      L 1000 335

      C 760 275
        250 275
        0 335

      Z
    `;


    const path4 = `
      M 0 0

      L 1000 0

      L 1000 210

      C 760 150
        250 150
        0 210

      Z
    `;


    const path5 = `
      M 0 0

      L 1000 0

      L 1000 75

      C 760 20
        250 20
        0 75

      Z
    `;


    const finalPath = `
      M 0 -100

      L 1000 -100

      L 1000 -60

      C 760 -110
        250 -110
        0 -60

      Z
    `;


    /*
      Simple interpolation helper
    */

    function extractNumbers(path) {

      return path
        .match(/-?[\d.]+/g)
        .map(Number);

    }


    function buildPath(template, numbers) {

      let index = 0;

      return template.replace(
        /-?[\d.]+/g,
        () => numbers[index++]
      );

    }


    function animatePath(
      from,
      to,
      duration
    ) {

      return new Promise(resolve => {

        const fromNumbers =
          extractNumbers(from);

        const toNumbers =
          extractNumbers(to);

        const start =
          performance.now();


        function frame(time) {

          const progress =
            Math.min(
              (time - start) / duration,
              1
            );


          /*
            Smooth cubic ease.

            Gives the reference animation
            that soft acceleration/
            deceleration.
          */

          const eased =
            progress < 0.5

            ? 4 *
              progress *
              progress *
              progress

            : 1 -
              Math.pow(
                -2 * progress + 2,
                3
              ) / 2;


          const currentNumbers =
            fromNumbers.map(
              (value, index) => {

                return value +
                  (
                    toNumbers[index] -
                    value
                  ) *
                  eased;

              }
            );


          mask.setAttribute(
            "d",
            buildPath(
              from,
              currentNumbers
            )
          );


          if (progress < 1) {

            requestAnimationFrame(frame);

          }

          else {

            resolve();

          }

        }


        requestAnimationFrame(frame);

      });

    }


    let running = false;


    async function runAnimation() {

      if (running) return;

      running = true;


      /*
        Hide play icon like reference
      */

      playButton.style.opacity = "0";

      playButton.style.pointerEvents =
        "none";


      /*
        Same curved edge moves upward.

        No liquid wobbling.
        No S-shaped wave.
        No random morph.
      */

      await animatePath(
        startPath,
        path2,
        260
      );


      await animatePath(
        path2,
        path3,
        240
      );


      await animatePath(
        path3,
        path4,
        230
      );


      await animatePath(
        path4,
        path5,
        220
      );


      await animatePath(
        path5,
        finalPath,
        220
      );


      running = false;

    }


    function resetAnimation() {

      running = false;

      mask.setAttribute(
        "d",
        startPath
      );


      playButton.style.opacity = "1";

      playButton.style.pointerEvents =
        "auto";

    }


    playButton.addEventListener(
      "click",
      runAnimation
    );


    resetButton.addEventListener(
      "click",
      () => {

        resetAnimation();

        setTimeout(
          runAnimation,
          250
        );

      }
    );

  </script>

</body>
</html>
