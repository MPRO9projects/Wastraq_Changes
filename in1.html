<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Smart Operations Platform</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f5f4ef;
      color: #202020;
    }

    :root {
      --green: #6FBB59;
      --teal: #159D91;
      --blue: #0750AD;

      --brand-gradient:
        linear-gradient(
          90deg,
          #6FBB59 0%,
          #159D91 45%,
          #0750AD 100%
        );

      --arc-text: #b7b8b4;
      --arc-dot: #d1d2ce;
    }

    /* =====================================================
       PAGE
    ===================================================== */

    .page {
      position: relative;

      width: 100vw;
      height: 100vh;

      min-height: 650px;

      overflow: hidden;

      background:
        linear-gradient(
          90deg,
          #f9f8f5 0%,
          #f4f3ee 100%
        );
    }

    /* =====================================================
       LARGE WHITE CIRCLE
    ===================================================== */

    .master-circle {
      position: absolute;

      z-index: 2;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 46% 46%,
          #ffffff 0%,
          #ffffff 75%,
          #fafaf8 100%
        );

      border:
        1px solid rgba(0,0,0,.025);

      box-shadow:
        28px 0 62px
        rgba(0,0,0,.035);

      pointer-events: none;
    }

    /* =====================================================
       INNER ICON CYCLE
       CENTERED INSIDE THE ARC
    ===================================================== */

    .icon-cycle {
      position: absolute;

      inset: 0;

      z-index: 18;

      pointer-events: none;
    }

    .cycle-icon {
      position: absolute;

      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        rgba(255,255,255,.96);

      border:
        1px solid rgba(0,0,0,.05);

      box-shadow:
        0 8px 22px rgba(0,0,0,.055);

      color: #c0c4c1;

      font-size: 16px;

      transform:
        translate(-50%, -50%);

      transition:
        width .38s cubic-bezier(.22,.75,.22,1),
        height .38s cubic-bezier(.22,.75,.22,1),
        font-size .38s cubic-bezier(.22,.75,.22,1),
        opacity .30s ease,
        box-shadow .38s ease,
        border-color .38s ease;

      will-change:
        left,
        top,
        transform;
    }

    .cycle-icon i {
      color: #c0c4c1;
    }

    .cycle-icon.active {
      width: 68px;
      height: 68px;

      font-size: 28px;

      background: #ffffff;

      border:
        1px solid rgba(21,157,145,.17);

      box-shadow:
        0 16px 38px rgba(0,0,0,.11);
    }

    .cycle-icon.active i {
      background:
        var(--brand-gradient);

      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color:
        transparent;

      color: transparent;
    }

    /* =====================================================
       OUTER ARC
    ===================================================== */

    .arc-layer {
      position: absolute;

      inset: 0;

      z-index: 50;

      pointer-events: none;
    }

    .arc-item {
      position: absolute;

      width: 190px;
      height: 42px;

      transform:
        translate(-100%, -50%);

      transform-origin:
        right center;

      pointer-events: none;

      will-change:
        left,
        top,
        opacity,
        transform;
    }

    .arc-label {
      position: absolute;

      right: 23px;
      top: 50%;

      max-width: 162px;

      transform:
        translateY(-50%);

      white-space: nowrap;

      text-align: right;

      overflow: hidden;

      text-overflow: ellipsis;

      color:
        var(--arc-text);

      font-size: 10px;

      line-height: 1;

      font-weight: 500;

      transition:
        right .3s ease,
        font-size .3s ease,
        opacity .3s ease,
        font-weight .3s ease;
    }

    .arc-dot {
      position: absolute;

      top: 50%;
      right: -4px;

      width: 7px;
      height: 7px;

      transform:
        translateY(-50%);

      border-radius: 50%;

      background:
        var(--arc-dot);

      transition:
        width .3s ease,
        height .3s ease,
        right .3s ease,
        background .3s ease,
        box-shadow .3s ease;
    }

    .arc-item.active .arc-label {
      right: 28px;

      max-width: 175px;

      overflow: visible;

      font-size:
        clamp(
          14px,
          1.08vw,
          19px
        );

      font-weight: 700;

      background:
        var(--brand-gradient);

      -webkit-background-clip:
        text;

      background-clip:
        text;

      -webkit-text-fill-color:
        transparent;

      color: transparent;
    }

    .arc-item.active .arc-dot {
      right: -7px;

      width: 12px;
      height: 12px;

      background:
        var(--brand-gradient);

      box-shadow:
        0 0 0 5px #fff,
        0 0 0 6px rgba(0,0,0,.055);
    }

    /* =====================================================
       RIGHT CONTENT
    ===================================================== */

    .right-area {
      position: absolute;

      left: 61%;
      top: 45%;

      z-index: 30;

      width: 34%;
      max-width: 590px;

      transform:
        translateY(-50%);
    }

    .right-inner {
      transition:
        opacity .3s ease,
        transform .47s cubic-bezier(.22,.75,.22,1),
        filter .3s ease;
    }

    .right-inner.switching {
      opacity: 0;

      transform:
        translateY(12px);

      filter:
        blur(3px);
    }

    .right-title {
      max-width: 560px;

      margin-bottom: 28px;

      color: #292929;

      font-size:
        clamp(
          30px,
          2.3vw,
          43px
        );

      font-weight: 500;

      line-height: 1.04;

      letter-spacing: -.04em;
    }

    .feature-list {
      list-style: none;

      display: flex;
      flex-direction: column;

      gap: 18px;

      width: 100%;
      max-width: 560px;
    }

    .feature-list li {
      position: relative;

      padding-left: 29px;

      color: #70726f;

      font-size:
        clamp(
          13px,
          1vw,
          15px
        );

      line-height: 1.5;
    }

    .feature-list li::before {
      content: "";

      position: absolute;

      left: 0;
      top: 7px;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        var(--brand-gradient);
    }

    /* =====================================================
       NEXT BUTTON
    ===================================================== */

    .next-button {
      position: absolute;

      left: 50.2%;
      top: 70%;

      z-index: 90;

      width: 76px;
      height: 72px;

      border: 0;

      cursor: pointer;

      background: #ffffff;

      clip-path:
        polygon(
          0 13%,
          19% 0,
          100% 50%,
          19% 100%,
          0 87%
        );

      filter:
        drop-shadow(
          0 13px 18px
          rgba(0,0,0,.09)
        );

      transition:
        transform .22s ease,
        filter .22s ease;
    }

    .next-button::after {
      content: "";

      position: absolute;

      left: 29px;
      top: 25px;

      width: 0;
      height: 0;

      border-top:
        10px solid transparent;

      border-bottom:
        10px solid transparent;

      border-left:
        15px solid #159D91;
    }

    .next-button:hover {
      transform:
        scale(1.06);
    }

    .next-button:active {
      transform:
        scale(.96);
    }

    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 1050px) {

      .right-area {
        left: 61%;
        top: 44%;

        width: 35%;
      }

    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 760px) {

      body {
        overflow-y: auto;
      }

      .page {
        min-height: 940px;
        height: 940px;
      }

      .right-area {
        left: 24px;
        top: 585px;

        width:
          calc(100% - 48px);

        transform: none;
      }

      .right-title {
        font-size: 28px;

        margin-bottom: 21px;
      }

      .feature-list {
        gap: 14px;
      }

      .next-button {
        left: auto;
        right: 18px;

        top: 505px;

        width: 63px;
        height: 60px;
      }

      .next-button::after {
        left: 24px;
        top: 20px;

        border-top-width: 9px;
        border-bottom-width: 9px;
        border-left-width: 13px;
      }

      .cycle-icon {
        width: 34px;
        height: 34px;

        font-size: 13px;
      }

      .cycle-icon.active {
        width: 52px;
        height: 52px;

        font-size: 21px;
      }

    }
  </style>
</head>

<body>

<div class="page">

  <!-- WHITE CIRCLE -->
  <div
    class="master-circle"
    id="masterCircle"
  ></div>

  <!-- CENTER ICON CYCLE -->
  <div
    class="icon-cycle"
    id="iconCycle"
  ></div>

  <!-- OUTER ARC -->
  <div
    class="arc-layer"
    id="arcLayer"
  ></div>

  <!-- RIGHT CONTENT -->
  <section class="right-area">

    <div
      class="right-inner"
      id="rightInner"
    >

      <h2
        class="right-title"
        id="rightTitle"
      >
        Workforce Management
      </h2>

      <ul
        class="feature-list"
        id="featureList"
      ></ul>

    </div>

  </section>

  <!-- NEXT -->
  <button
    class="next-button"
    id="nextButton"
    aria-label="Next feature"
  ></button>

</div>

<script>

  const modules = [

    {
      title: "Workforce Management",
      short: "Workforce Management",
      icon: "fa-users",

      bullets: [
        "Staff records and role-based access for your whole team",
        "Biometric attendance — no manual sign-in sheets",
        "Simple shift and duty scheduling",
        "Real-time visibility into staff activity"
      ]
    },

    {
      title: "Field Operations",
      short: "Field Operations",
      icon: "fa-route",

      bullets: [
        "Daily collection and route tracking",
        "Field issue reporting and resolution",
        "Task and work assignment management",
        "Live status updates across every team"
      ]
    },

    {
      title: "Fleet Tracking",
      short: "Fleet Tracking",
      icon: "fa-truck-fast",

      bullets: [
        "Live GPS tracking for every vehicle",
        "Real-time route and location visibility",
        "Driver trip and task management",
        "Distance and trip history at a glance"
      ]
    },

    {
      title: "Vendor Management",
      short: "Vendor Management",
      icon: "fa-handshake",

      bullets: [
        "One centralized vendor directory",
        "Quick onboarding for new suppliers",
        "Track vendor performance and history",
        "Manage vendor documents in one place"
      ]
    },

    {
      title: "Weighbridge",
      short: "Weighbridge",
      icon: "fa-scale-balanced",

      bullets: [
        "Accurate gross and tare weight capture",
        "Automatic weighment record creation",
        "Vehicle entry and exit tracking",
        "Fully digital records — no paperwork"
      ]
    },

    {
      title: "Material Recovery",
      short: "Material Recovery",
      icon: "fa-recycle",

      bullets: [
        "Waste segregation and classification",
        "Track materials from collection to processing",
        "Bailing and dispatch record-keeping",
        "Full material traceability, end to end"
      ]
    },

    {
      title: "Inventory Control",
      short: "Inventory Control",
      icon: "fa-boxes-stacked",

      bullets: [
        "Real-time stock level visibility",
        "Track every stock movement",
        "Easy stock clearance and reconciliation",
        "Never run short or overstock again"
      ]
    },

    {
      title: "Finance & Expenses",
      short: "Finance & Expenses",
      icon: "fa-coins",

      bullets: [
        "Simple expense tracking",
        "Clear profit & loss visibility",
        "Cost breakdown by site, vehicle, or operation",
        "No more manual spreadsheets"
      ]
    },

    {
      title: "Compliance & Audit",
      short: "Compliance & Audit",
      icon: "fa-clipboard-check",

      bullets: [
        "Complete audit trail for every action",
        "Ready-to-export compliance reports",
        "Activity logs for full accountability",
        "Always inspection-ready"
      ]
    },

    {
      title: "Analytics & Insights",
      short: "Analytics & Insights",
      icon: "fa-chart-line",

      bullets: [
        "Real-time dashboards across every module",
        "Visual reports for faster decisions",
        "Track performance across teams and sites",
        "Data you can actually act on"
      ]
    }

  ];


  const masterCircle =
    document.getElementById(
      "masterCircle"
    );


  const iconCycle =
    document.getElementById(
      "iconCycle"
    );


  const arcLayer =
    document.getElementById(
      "arcLayer"
    );


  const rightTitle =
    document.getElementById(
      "rightTitle"
    );


  const featureList =
    document.getElementById(
      "featureList"
    );


  const rightInner =
    document.getElementById(
      "rightInner"
    );


  const nextButton =
    document.getElementById(
      "nextButton"
    );


  const arcItems = [];


  modules.forEach(
    module => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "arc-item";


      const label =
        document.createElement(
          "div"
        );


      label.className =
        "arc-label";


      label.textContent =
        module.short;


      const dot =
        document.createElement(
          "div"
        );


      dot.className =
        "arc-dot";


      item.appendChild(
        label
      );


      item.appendChild(
        dot
      );


      arcLayer.appendChild(
        item
      );


      arcItems.push(
        item
      );

    }
  );


  const cycleIcons = [];


  modules.forEach(
    module => {

      const icon =
        document.createElement(
          "div"
        );


      icon.className =
        "cycle-icon";


      icon.innerHTML =
        `
          <i class="fa-solid ${module.icon}"></i>
        `;


      iconCycle.appendChild(
        icon
      );


      cycleIcons.push(
        icon
      );

    }
  );


  let currentIndex = 0;

  let positionValue = 0;

  let animating = false;

  let autoplay;


  function easeInOutQuint(t) {

    return t < .5

      ? 16 *
        t *
        t *
        t *
        t *
        t

      : 1 -
        Math.pow(
          -2 * t + 2,
          5
        ) / 2;

  }


  function getGeometry() {

    const width =
      window.innerWidth;


    const height =
      window.innerHeight;


    if (
      width <= 760
    ) {

      return {

        radius:
          390,

        centerX:
          -35,

        centerY:
          290

      };

    }


    const radius =
      Math.max(
        height * .77,
        width * .395
      );


    const rightEdge =
      width * .535;


    return {

      radius,

      centerX:
        rightEdge -
        radius,

      centerY:
        height * .50

    };

  }


  function positionCircle() {

    const geo =
      getGeometry();


    const diameter =
      geo.radius *
      2;


    masterCircle.style.width =
      `${diameter}px`;


    masterCircle.style.height =
      `${diameter}px`;


    masterCircle.style.left =
      `${
        geo.centerX -
        geo.radius
      }px`;


    masterCircle.style.top =
      `${
        geo.centerY -
        geo.radius
      }px`;

  }


  function drawArc() {

    const geo =
      getGeometry();


    const step =
      window.innerWidth <= 760

        ? 10.5

        : 8.7;


    arcItems.forEach(
      (
        item,
        index
      ) => {


        let offset =
          index -
          positionValue;


        const half =
          modules.length /
          2;


        while (
          offset > half
        ) {

          offset -=
            modules.length;

        }


        while (
          offset < -half
        ) {

          offset +=
            modules.length;

        }


        const angle =
          offset *
          step;


        const radians =
          angle *
          Math.PI /
          180;


        const x =

          geo.centerX +

          Math.cos(
            radians
          ) *

          geo.radius;


        const y =

          geo.centerY +

          Math.sin(
            radians
          ) *

          geo.radius;


        item.style.left =
          `${x}px`;


        item.style.top =
          `${y}px`;


        const distance =
          Math.abs(
            offset
          );


        let opacity =
          1;


        if (
          distance >
          4.8
        ) {

          opacity =
            0;

        }

        else if (
          distance >
          4
        ) {

          opacity =
            .14;

        }

        else if (
          distance >
          3
        ) {

          opacity =
            .29;

        }

        else if (
          distance >
          2
        ) {

          opacity =
            .47;

        }

        else if (
          distance >
          1
        ) {

          opacity =
            .70;

        }


        item.style.opacity =
          opacity;


        const scale =

          1 -

          Math.min(
            distance *
            .014,
            .055
          );


        item.style.transform =

          `
            translate(-100%, -50%)
            scale(${scale})
          `;

      }
    );

  }


  /* =====================================================
     ICON CYCLE
     CENTERED IN THE WHITE ARC
  ===================================================== */

  function drawIconCycle() {

    const width =
      window.innerWidth;


    const height =
      window.innerHeight;


    let centerX;
    let centerY;
    let radius;


    if (
      width <= 760
    ) {

      centerX =
        width * .34;


      centerY =
        290;


      radius =
        108;

    }

    else {

      /*
         Main correction:
         icon cycle now sits in the
         visual center of the white circle.
      */

      centerX =
        width * .205;


      centerY =
        height * .50;


      radius =
        Math.min(
          width * .12,
          height * .19
        );

    }


    cycleIcons.forEach(
      (
        icon,
        index
      ) => {


        let offset =
          index -
          positionValue;


        const half =
          modules.length /
          2;


        while (
          offset > half
        ) {

          offset -=
            modules.length;

        }


        while (
          offset < -half
        ) {

          offset +=
            modules.length;

        }


        const angle =

          -90 +

          offset *

          (
            360 /
            modules.length
          );


        const radians =

          angle *

          Math.PI /

          180;


        const x =

          centerX +

          Math.cos(
            radians
          ) *

          radius;


        const y =

          centerY +

          Math.sin(
            radians
          ) *

          radius;


        icon.style.left =
          `${x}px`;


        icon.style.top =
          `${y}px`;


        const distance =
          Math.abs(
            offset
          );


        const scale =

          1 -

          Math.min(
            distance *
            .036,
            .15
          );


        icon.style.transform =

          `
            translate(-50%, -50%)
            scale(${scale})
          `;


        icon.style.opacity =

          Math.max(
            .48,
            1 -
            distance *
            .09
          );

      }
    );

  }


  function setActive() {

    arcItems.forEach(
      (
        item,
        index
      ) => {

        item.classList.toggle(
          "active",
          index === currentIndex
        );

      }
    );


    cycleIcons.forEach(
      (
        icon,
        index
      ) => {

        icon.classList.toggle(
          "active",
          index === currentIndex
        );

      }
    );

  }


  function setContent(
    index
  ) {

    const module =
      modules[index];


    rightTitle.textContent =
      module.title;


    featureList.innerHTML =

      module.bullets

        .map(
          bullet =>
            `<li>${bullet}</li>`
        )

        .join("");

  }


  function transitionContent(
    index
  ) {

    rightInner.classList.add(
      "switching"
    );


    setTimeout(
      () => {

        setContent(
          index
        );


        rightInner.classList.remove(
          "switching"
        );

      },
      290
    );

  }


  function nextModule() {

    if (
      animating
    ) {
      return;
    }


    animating =
      true;


    const from =
      positionValue;


    const to =
      from + 1;


    const nextIndex =

      (
        currentIndex +
        1
      )

      %

      modules.length;


    arcItems[
      currentIndex
    ].classList.remove(
      "active"
    );


    cycleIcons[
      currentIndex
    ].classList.remove(
      "active"
    );


    setTimeout(
      () => {

        transitionContent(
          nextIndex
        );

      },
      350
    );


    const start =
      performance.now();


    const duration =
      1150;


    function frame(
      now
    ) {


      const raw =

        Math.min(

          (
            now -
            start
          )

          /

          duration,

          1

        );


      const eased =
        easeInOutQuint(
          raw
        );


      positionValue =
        from +
        eased;


      drawArc();

      drawIconCycle();


      if (
        raw < 1
      ) {

        requestAnimationFrame(
          frame
        );

      }


      else {

        positionValue =
          to;


        currentIndex =
          nextIndex;


        if (
          positionValue >=
          modules.length
        ) {

          positionValue -=
            modules.length;

        }


        setActive();


        drawArc();

        drawIconCycle();


        animating =
          false;

      }

    }


    requestAnimationFrame(
      frame
    );

  }


  function previousModule() {

    if (
      animating
    ) {
      return;
    }


    animating =
      true;


    const from =
      positionValue;


    const to =
      from - 1;


    const previousIndex =

      (
        currentIndex -
        1 +
        modules.length
      )

      %

      modules.length;


    arcItems[
      currentIndex
    ].classList.remove(
      "active"
    );


    cycleIcons[
      currentIndex
    ].classList.remove(
      "active"
    );


    setTimeout(
      () => {

        transitionContent(
          previousIndex
        );

      },
      350
    );


    const start =
      performance.now();


    const duration =
      1150;


    function frame(
      now
    ) {


      const raw =

        Math.min(

          (
            now -
            start
          )

          /

          duration,

          1

        );


      const eased =
        easeInOutQuint(
          raw
        );


      positionValue =
        from -
        eased;


      drawArc();

      drawIconCycle();


      if (
        raw < 1
      ) {

        requestAnimationFrame(
          frame
        );

      }


      else {

        positionValue =
          to;


        currentIndex =
          previousIndex;


        if (
          positionValue <
          0
        ) {

          positionValue +=
            modules.length;

        }


        setActive();


        drawArc();

        drawIconCycle();


        animating =
          false;

      }

    }


    requestAnimationFrame(
      frame
    );

  }


  nextButton.addEventListener(
    "click",
    () => {

      nextModule();

      restartAuto();

    }
  );


  let wheelLocked =
    false;


  window.addEventListener(
    "wheel",
    event => {

      event.preventDefault();


      if (
        animating ||
        wheelLocked
      ) {
        return;
      }


      wheelLocked =
        true;


      if (
        event.deltaY >
        0
      ) {

        nextModule();

      }

      else {

        previousModule();

      }


      restartAuto();


      setTimeout(
        () => {

          wheelLocked =
            false;

        },
        1200
      );

    },
    {
      passive: false
    }
  );


  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
          "ArrowRight" ||
        event.key ===
          "ArrowDown"
      ) {

        nextModule();

        restartAuto();

      }


      if (
        event.key ===
          "ArrowLeft" ||
        event.key ===
          "ArrowUp"
      ) {

        previousModule();

        restartAuto();

      }

    }
  );


  let touchStartY =
    0;


  document.addEventListener(
    "touchstart",
    event => {

      touchStartY =
        event
          .touches[0]
          .clientY;

    },
    {
      passive: true
    }
  );


  document.addEventListener(
    "touchend",
    event => {

      const touchEndY =
        event
          .changedTouches[0]
          .clientY;


      const diff =
        touchStartY -
        touchEndY;


      if (
        Math.abs(
          diff
        ) < 45
      ) {
        return;
      }


      if (
        diff >
        0
      ) {

        nextModule();

      }

      else {

        previousModule();

      }


      restartAuto();

    },
    {
      passive: true
    }
  );


  function startAuto() {

    clearInterval(
      autoplay
    );


    autoplay =
      setInterval(
        () => {

          nextModule();

        },
        4000
      );

  }


  function restartAuto() {

    clearInterval(
      autoplay
    );


    autoplay =
      setInterval(
        () => {

          nextModule();

        },
        4000
      );

  }


  function layout() {

    positionCircle();

    drawArc();

    drawIconCycle();

  }


  window.addEventListener(
    "resize",
    layout
  );


  setContent(
    0
  );


  positionCircle();


  setActive();


  drawArc();


  drawIconCycle();


  startAuto();

</script>

</body>
</html>
